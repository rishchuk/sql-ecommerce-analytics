services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - ./schema.sql:/schema.sql
      - ./init.sh:/init.sh
    command: ["/bin/bash", "/init.sh"]

  data-generator:
    build: 
      context: ../data-generator
      dockerfile: Dockerfile.mssql
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
    depends_on:
      mssql-init:
        condition: service_completed_successfully
